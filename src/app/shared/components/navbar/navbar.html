<nav class="navbar panel" aria-label="Navegacion principal">
  <a class="brand" href="/" aria-label="Inicio POS">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" role="img">
        <rect x="8" y="7" width="32" height="34" rx="7" />
        <path d="M15 17h18" />
        <path d="M15 24h18" />
        <path d="M16 32h6" />
        <path d="M27 32h5" />
        <circle cx="35" cy="13" r="5" />
      </svg>
    </span>
    <span>
      <strong>POS</strong>
      <small>Punto de venta</small>
    </span>
  </a>

  <div class="nav-actions">
    @if (authService.isAuthenticated()) {
      @if (authService.isAdmin()) {
        <div class="notifications-wrapper">
          <button class="btn btn-icon notifications-button" aria-label="Notificaciones" type="button" (click)="toggleNotifs()">
            <span class="notifications-icon" aria-hidden="true">🔔</span>
            @if (unreadNotifications() > 0) {
              <span class="notifications-badge">{{ unreadNotifications() }}</span>
            }
          </button>
          @if (notifsOpen()) {
            <div class="notifications-dropdown">
              <app-notification-center (unreadCountChange)="updateUnreadNotifications($event)"></app-notification-center>
            </div>
          }
        </div>
      }
      <button class="btn btn-danger" type="button" (click)="cerrarSesion()">Cerrar sesion</button>
    } @else {
      <a class="btn btn-secondary" routerLink="/register"> Registrar </a>
      <div class="login-menu">
        <button
          class="btn btn-primary login-trigger"
          type="button"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuLoginAbierto()"
          (click)="alternarMenuLogin()"
        >
          Iniciar sesion
          <span aria-hidden="true">▾</span>
        </button>

        @if (menuLoginAbierto()) {
          <div class="login-dropdown panel" role="menu">
            <a
              routerLink="/login"
              [queryParams]="{ rol: 'administrador' }"
              role="menuitem"
              (click)="cerrarMenuLogin()"
            >
              Administrador
            </a>
            <a
              routerLink="/login"
              [queryParams]="{ rol: 'empleado' }"
              role="menuitem"
              (click)="cerrarMenuLogin()"
            >
              Empleado
            </a>
          </div>
        }
      </div>
    }
  </div>
</nav>
