<div class="register-page">
  <main class="register-shell">
    <section class="register-panel panel">
      <a class="register-brand" href="/" aria-label="Volver al inicio">POS</a>

      <header class="register-header">
        <p class="badge badge-success">Nuevo acceso</p>
        <h1 class="title-xl">Crear cuenta</h1>
        <p class="text-muted">Registra tus datos para acceder al sistema.</p>
      </header>

      <form class="register-form" aria-label="Formulario de registro">
        <div class="form-group span-2">
          <label class="label" for="nombreCompleto">Nombre completo</label>
          <input
            class="input"
            id="nombreCompleto"
            name="nombreCompleto"
            type="text"
            placeholder="Ayrton Daza Miranda"
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label class="label" for="correo">Correo electronico</label>
          <input
            class="input"
            id="correo"
            name="correo"
            type="email"
            placeholder="ayrton.daza.1230@gmail.com"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="label" for="fechaNacimiento">Fecha de nacimiento</label>
          <input
            class="input"
            id="fechaNacimiento"
            name="fechaNacimiento"
            type="date"
          />
        </div>

        <div class="form-group">
          <label class="label" for="documento">Documento</label>
          <input
            class="input"
            id="documento"
            name="documento"
            type="text"
            placeholder="1234567890"
            inputmode="numeric"
          />
        </div>

        <div class="form-group">
          <label class="label" for="genero">Genero</label>
          <select class="select" id="genero" name="genero">
            <option value="">Selecciona una opcion</option>
            <option value="femenino">Femenino</option>
            <option value="masculino">Masculino</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="form-group span-2">
          <label class="label" for="telefono">Telefono</label>
          <input
            class="input"
            id="telefono"
            name="telefono"
            type="tel"
            placeholder="61524977"
            autocomplete="tel"
          />
        </div>

        <div class="form-group">
          <label class="label" for="contrasena">Contrasena</label>
          <input
            class="input"
            id="contrasena"
            name="contrasena"
            type="password"
            placeholder="Minimo 6 caracteres"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label class="label" for="confirmarContrasena">Confirmar contrasena</label>
          <input
            class="input"
            id="confirmarContrasena"
            name="confirmarContrasena"
            type="password"
            placeholder="Repite tu contrasena"
            autocomplete="new-password"
          />
        </div>

        <button class="btn btn-primary submit-button span-2" type="submit">
          Registrarme
        </button>
      </form>

      <p class="login-link text-muted">
        Ya tienes cuenta?
        <a routerLink="/login">Inicia sesion</a>
      </p>
    </section>
  </main>
</div>
