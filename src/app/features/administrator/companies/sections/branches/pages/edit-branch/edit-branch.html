<div class="page-container edit-branch-page">
  <app-navbar />

  <main class="edit-branch-layout">
    <app-sidebar [items]="sidebarItems" />

    <section class="edit-branch-content">
      <section class="edit-branch-panel panel">
        <a class="back-link" [routerLink]="['/administrator/company', companyId, 'branches']">Volver a Sucursales</a>

        <header class="edit-branch-header">
          <p class="badge badge-success">Sucursal {{ branchId }}</p>
          <h1 class="title-xl">Editar Sucursal</h1>
          <p class="text-muted">Actualiza los datos principales de la sucursal.</p>
        </header>

        <form class="branch-form" aria-label="Formulario de edicion de sucursal">
          <div class="form-group">
            <label class="label" for="nombre">Nombre</label>
            <input class="input" id="nombre" name="nombre" type="text" placeholder="Sucursal Central" />
          </div>

          <div class="form-group">
            <label class="label" for="direccion">Direccion</label>
            <input class="input" id="direccion" name="direccion" type="text" placeholder="Av. Principal 1245" />
          </div>

          <div class="form-group">
            <label class="label" for="telefono">Telefono</label>
            <input class="input" id="telefono" name="telefono" type="tel" placeholder="61524977" />
          </div>

          <div class="form-group">
            <label class="label" for="ciudad">Ciudad</label>
            <input class="input" id="ciudad" name="ciudad" type="text" placeholder="La Paz" />
          </div>

          <div class="form-group status-field">
            <span class="label">Activo</span>
            <label class="switch">
              <input type="checkbox" name="activo" checked />
              <span class="switch-track" aria-hidden="true">
                <span class="switch-thumb"></span>
              </span>
              <span class="switch-text">Sucursal activa</span>
            </label>
          </div>

          <div class="form-actions">
            <a class="btn btn-secondary" [routerLink]="['/administrator/company', companyId, 'branches']">Cancelar</a>
            <button class="btn btn-primary" type="submit">Guardar cambios</button>
          </div>
        </form>
      </section>
    </section>
  </main>
</div>
